<svg xmlns="http://www.w3.org/2000/svg" width="720" height="388" viewBox="0 0 720 388" role="img" aria-labelledby="title description">
  <title id="title">What CryoCore gives your agent</title>
  <desc id="description">Choose tools using role, version and license records. Call APIs and reusable scripts. Chain declared inputs and outputs. Check results before another tool uses them.</desc>
  <rect width="720" height="388" rx="18" fill="#f3f7fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g id="knowledge">
      <rect x="20" y="20" width="332" height="166" rx="12" fill="#ffffff" stroke="#cbd9e5"/>
      <path d="M 44 46 H 84" stroke="#0e7490" stroke-width="4" stroke-linecap="round"/>
      <text x="44" y="86" font-size="26" font-weight="700" fill="#102c42" text-anchor="start">Choose tools</text>
      <text x="44" y="122" font-size="24" fill="#334e63" text-anchor="start">Roles, versions, terms</text>
      <text x="44" y="154" font-size="24" fill="#334e63" text-anchor="start">Tool knowledge base</text>
    </g>
    <g id="calls">
      <rect x="368" y="20" width="332" height="166" rx="12" fill="#ffffff" stroke="#cbd9e5"/>
      <path d="M 392 46 H 432" stroke="#0e7490" stroke-width="4" stroke-linecap="round"/>
      <text x="392" y="86" font-size="26" font-weight="700" fill="#102c42" text-anchor="start">Call tools</text>
      <text x="392" y="122" font-size="24" fill="#334e63" text-anchor="start">APIs and commands</text>
      <text x="392" y="154" font-size="24" fill="#334e63" text-anchor="start">Reusable scripts</text>
    </g>
    <g id="chaining">
      <rect x="20" y="202" width="332" height="166" rx="12" fill="#ffffff" stroke="#cbd9e5"/>
      <path d="M 44 228 H 84" stroke="#0e7490" stroke-width="4" stroke-linecap="round"/>
      <text x="44" y="268" font-size="26" font-weight="700" fill="#102c42" text-anchor="start">Chain tools</text>
      <text x="44" y="304" font-size="24" fill="#334e63" text-anchor="start">Inputs and outputs</text>
      <text x="44" y="336" font-size="24" fill="#334e63" text-anchor="start">Connected steps</text>
    </g>
    <g id="checks">
      <rect x="368" y="202" width="332" height="166" rx="12" fill="#ffffff" stroke="#cbd9e5"/>
      <path d="M 392 228 H 432" stroke="#0e7490" stroke-width="4" stroke-linecap="round"/>
      <text x="392" y="268" font-size="26" font-weight="700" fill="#102c42" text-anchor="start">Check results</text>
      <text x="392" y="304" font-size="24" fill="#334e63" text-anchor="start">Files, hashes, map fit</text>
      <text x="392" y="336" font-size="24" fill="#334e63" text-anchor="start">Checks before handoff</text>
    </g>
  </g>
</svg>
