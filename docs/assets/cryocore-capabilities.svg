<svg xmlns="http://www.w3.org/2000/svg" width="720" height="388" viewBox="0 0 720 388" role="img" aria-labelledby="title description">
  <title id="title">Four CryoCore workflows</title>
  <desc id="description">Plan processing from movies to maps. Review structures with map fit and geometry checks. Compare conformational states and the evidence for each. Prepare labeled structure figures with reproducible settings.</desc>
  <rect width="720" height="388" rx="18" fill="#f3f7fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g id="processing">
      <rect x="20" y="20" width="332" height="166" rx="12" fill="#ffffff" stroke="#cbd9e5"/>
      <path d="M 44 46 H 84" stroke="#0e7490" stroke-width="4" stroke-linecap="round"/>
      <text x="44" y="86" font-size="26" font-weight="700" fill="#102c42" text-anchor="start">Plan processing</text>
      <text x="44" y="122" font-size="24" fill="#334e63" text-anchor="start">Movies to maps</text>
      <text x="44" y="154" font-size="24" fill="#334e63" text-anchor="start">Tool and compute plans</text>
    </g>
    <g id="structures">
      <rect x="368" y="20" width="332" height="166" rx="12" fill="#ffffff" stroke="#cbd9e5"/>
      <path d="M 392 46 H 432" stroke="#0e7490" stroke-width="4" stroke-linecap="round"/>
      <text x="392" y="86" font-size="26" font-weight="700" fill="#102c42" text-anchor="start">Review structures</text>
      <text x="392" y="122" font-size="24" fill="#334e63" text-anchor="start">Map fit and geometry</text>
      <text x="392" y="154" font-size="24" fill="#334e63" text-anchor="start">Validation summaries</text>
    </g>
    <g id="states">
      <rect x="20" y="202" width="332" height="166" rx="12" fill="#ffffff" stroke="#cbd9e5"/>
      <path d="M 44 228 H 84" stroke="#0e7490" stroke-width="4" stroke-linecap="round"/>
      <text x="44" y="268" font-size="26" font-weight="700" fill="#102c42" text-anchor="start">Compare states</text>
      <text x="44" y="304" font-size="24" fill="#334e63" text-anchor="start">Classes and populations</text>
      <text x="44" y="336" font-size="24" fill="#334e63" text-anchor="start">Evidence for each state</text>
    </g>
    <g id="figures">
      <rect x="368" y="202" width="332" height="166" rx="12" fill="#ffffff" stroke="#cbd9e5"/>
      <path d="M 392 228 H 432" stroke="#0e7490" stroke-width="4" stroke-linecap="round"/>
      <text x="392" y="268" font-size="26" font-weight="700" fill="#102c42" text-anchor="start">Prepare figures</text>
      <text x="392" y="304" font-size="24" fill="#334e63" text-anchor="start">Labeled structure views</text>
      <text x="392" y="336" font-size="24" fill="#334e63" text-anchor="start">Reproducible settings</text>
    </g>
  </g>
</svg>
