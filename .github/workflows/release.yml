name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Run public release gate
        run: PATH="$HOME/go/bin:$PATH" REQUIRE_GITLEAKS=1 make release-check
      - name: Build release evidence bundle
        run: |
          mkdir -p "$RUNNER_TEMP/cryocore-release"
          python3 scripts/cryocore/public_release_report.py --repo-root . --publish-ready --public-summary --out "$RUNNER_TEMP/cryocore-release/public-release-report.json" --json
          git archive --format=tar.gz --output "$RUNNER_TEMP/cryocore-release/cryocore-${GITHUB_REF_NAME}.tar.gz" HEAD
          (cd "$RUNNER_TEMP/cryocore-release" && shasum -a 256 * > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: cryocore-public-release-evidence
          path: ${{ runner.temp }}/cryocore-release/
