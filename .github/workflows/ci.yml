name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Run public release gate
        run: PATH="$HOME/go/bin:$PATH" REQUIRE_GITLEAKS=1 make release-check

  optional-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install adapter test dependencies
        run: python -m pip install -r requirements-dev.txt numpy==1.26.4 mrcfile==1.5.4
      - name: Test native adapters and MRC byte preservation
        run: >-
          python -m pytest
          tests/test_em_tool_miffi_worker_v1.py
          tests/test_em_tool_czi_worker_v1.py
          tests/test_normalize_mrc_header_v1.py
